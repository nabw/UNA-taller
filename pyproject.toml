[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "una_taller"
version = "0.2.0"
description = "Taller: Discretización de Sistemas Dinámicos y Problemas Inversos en Ciencia de Datos"
readme = "README.md"
authors = [
    { name = "Universidad Nacional de Costa Rica", email = "contacto@una.ac.cr" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
